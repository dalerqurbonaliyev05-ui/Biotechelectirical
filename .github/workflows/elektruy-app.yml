# ElektrUy (elektruy/app): analyze, unit + widget tests, content check, debug APK.
# Pushes to the ElektrUy branches and to main also publish the APK as a
# prerelease so it can be installed straight from the phone.
#
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   ELEKTRUY_GOOGLE_WEB_CLIENT_ID  OAuth *web* client ID used as serverClientId for Google sign-in.
#   ELEKTRUY_SUPABASE_URL / ELEKTRUY_SUPABASE_ANON_KEY  override the defaults in lib/core/env.dart.
name: ElektrUy app

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'elektruy/app/**'
      - 'elektruy/content/**'
      - 'elektruy/scripts/**'
      - '.github/workflows/elektruy-app.yml'
  pull_request:
    paths:
      - 'elektruy/app/**'
      - 'elektruy/content/**'
      - 'elektruy/scripts/**'
      - '.github/workflows/elektruy-app.yml'
  workflow_dispatch:

concurrency:
  group: elektruy-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Content is valid and generated files are up to date
        working-directory: elektruy
        run: node scripts/build-content.mjs --check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Translations are complete (uz / ru / en)
        working-directory: elektruy/app
        run: |
          node l10n_src/build.mjs
          git diff --exit-code -- lib/l10n/*.arb

      - name: Dependencies
        working-directory: elektruy/app
        run: flutter pub get

      - name: Analyze
        working-directory: elektruy/app
        run: flutter analyze

      - name: Tests
        working-directory: elektruy/app
        run: flutter test

  apk:
    name: Debug APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Stable debug signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ELEKTRUY_DEBUG_KEYSTORE_B64 }}
        run: |
          # Without it every run gets a fresh debug key and Google sign-in needs a new SHA-1.
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build debug APK
        working-directory: elektruy/app
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.ELEKTRUY_GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ vars.ELEKTRUY_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.ELEKTRUY_SUPABASE_ANON_KEY }}
        run: |
          defines=()
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] && defines+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID")
          [ -n "$SUPABASE_URL" ] && defines+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] && defines+=(--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          flutter pub get
          flutter build apk --debug "${defines[@]}"
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/elektruy-debug.apk"
          # SHA-1 of the debug key: register it on the Android OAuth client (docs/GOOGLE_OAUTH.md).
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android \
            | grep -E 'SHA1|SHA256' | tee "$RUNNER_TEMP/debug-signing.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: elektruy-debug-apk
          path: |
            ${{ runner.temp }}/elektruy-debug.apk
            ${{ runner.temp }}/debug-signing.txt
          retention-days: 14

      # Feature branches only: main gets a signed release from elektruy-release.yml.
      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="elektruy-debug-${GITHUB_SHA::7}"
          gh release create "$tag" "$RUNNER_TEMP/elektruy-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ElektrUy debug ${GITHUB_SHA::7}" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android 7+; allow installs from this source. Not for production." 
