# Fizika: alohida Android ilova (Capacitor). Ekranlar, savol rasmlari va shriftlar APK ichida,
# internet faqat Supabase (kirish, testlar, reyting) uchun. Natija: fizika/apk/fizika.apk va
# fizika/apk-info.js main'ga yoziladi (yuklab olish sahifasi shu fayllardan foydalanadi).
#
# Imzo kaliti: Settings > Secrets > Actions ga qo'shilsa (tavsiya etiladi, kalit doimiy bo'ladi):
#   FIZIKA_KEYSTORE_B64  — base64 ko'rinishidagi .keystore fayl (alias: fizika)
#   FIZIKA_KEYSTORE_PASS — kalit paroli
# Secret bo'lmasa kalit Actions keshidan olinadi, u ham bo'lmasa yangisi yaratiladi.
name: Fizika APK

on:
  push:
    branches: [main]
    paths:
      - 'fizika-src/**'
      - '.github/workflows/fizika-apk.yml'
  workflow_dispatch:

concurrency:
  group: fizika-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fizika-src
    env:
      KS_DIR: /home/runner/fizika-ks
      LOG: /home/runner/fizika-ci.log
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK litsenziyalari
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" 2>&1 | tee -a "$LOG"

      - name: npm install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tail -n 30 | tee -a "$LOG"

      - name: Ilovani yig'ish (NATIVE=1)
        run: |
          set -o pipefail
          NATIVE=1 node build.mjs 2>&1 | tee -a "$LOG"
          du -sh dist-native | tee -a "$LOG"

      - name: Capacitor Android loyihasi
        run: |
          set -o pipefail
          rm -rf android
          npx cap add android 2>&1 | tail -n 30 | tee -a "$LOG"
          node mobile/prepare-android.mjs 2>&1 | tee -a "$LOG"
          npx cap sync android 2>&1 | tail -n 30 | tee -a "$LOG"
          grep -n "scheme\|launchMode" android/app/src/main/AndroidManifest.xml | tee -a "$LOG"

      - name: Imzo kalitini keshdan olish
        uses: actions/cache/restore@v4
        with:
          path: ~/fizika-ks
          key: fizika-keystore-v1

      - name: Imzo kaliti
        id: ks
        env:
          KS_B64: ${{ secrets.FIZIKA_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.FIZIKA_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          mkdir -p "$KS_DIR"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS_DIR/android.keystore"
            echo "$KS_PASS_SECRET" > "$KS_DIR/pass"
            echo "kalit: secret" | tee -a "$LOG"
          elif [ -f "$KS_DIR/android.keystore" ] && [ -f "$KS_DIR/pass" ]; then
            echo "kalit: kesh" | tee -a "$LOG"
          else
            openssl rand -hex 24 > "$KS_DIR/pass"
            P=$(cat "$KS_DIR/pass")
            keytool -genkeypair -v -keystore "$KS_DIR/android.keystore" -alias fizika -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$P" -keypass "$P" \
              -dname "CN=Fizika, OU=EnergyVibe, O=EnergyVibe, L=Tashkent, C=UZ" 2>&1 | tee -a "$LOG"
            echo "kalit: yangi yaratildi" | tee -a "$LOG"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$(cat "$KS_DIR/pass")"

      - name: Imzo kalitini keshga saqlash
        if: steps.ks.outputs.new == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/fizika-ks
          key: fizika-keystore-v1

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle assembleRelease
        working-directory: fizika-src/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -n 200 | tee -a "$LOG"
          ls -la app/build/outputs/apk/release | tee -a "$LOG"

      - name: Imzolash
        working-directory: fizika-src/android
        run: |
          set -o pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          P=$(cat "$KS_DIR/pass")
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk 2>&1 | tee -a "$LOG"
          "$BT/apksigner" sign --ks "$KS_DIR/android.keystore" --ks-key-alias fizika \
            --ks-pass "pass:$P" --key-pass "pass:$P" --out fizika.apk aligned.apk 2>&1 | tee -a "$LOG"
          "$BT/apksigner" verify --print-certs fizika.apk 2>&1 | tee -a "$LOG"
          "$BT/aapt2" dump badging fizika.apk 2>/dev/null | head -n 3 | tee -a "$LOG" || true

      - name: APK ni main'ga yozish
        working-directory: .
        run: |
          set -o pipefail
          mkdir -p fizika/apk
          cp fizika-src/android/fizika.apk fizika/apk/fizika.apk
          BYTES=$(stat -c %s fizika/apk/fizika.apk)
          SHA=$(sha256sum fizika/apk/fizika.apk | cut -d' ' -f1)
          DATE=$(TZ=Asia/Tashkent date +%d.%m.%Y)
          printf '%s\n' \
            "/* GitHub Actions (.github/workflows/fizika-apk.yml) har safar APK yig'ilganda shu faylni yangilaydi. */" \
            "window.FIZIKA_APK = {" \
            "    VERSION: '$VERSION_NAME'," \
            "    FILE: '/fizika/apk/fizika.apk'," \
            "    BYTES: $BYTES," \
            "    SHA256: '$SHA'," \
            "    DATE: '$DATE'" \
            "};" > fizika/apk-info.js
          cat fizika/apk-info.js | tee -a "$LOG"
          # admin panel (veb) ham shu manbadan yangilanadi
          (cd fizika-src && node build.mjs && bash mobile/deploy-admin.sh) 2>&1 | tail -n 5 | tee -a "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add fizika/apk/fizika.apk fizika/apk-info.js
          git add -A fizika/admin
          git commit -m "Fizika APK $VERSION_NAME [skip actions]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1

      - name: Xato bo'lsa jurnalni fizika-ci-log tarmog'iga yozish
        if: failure()
        working-directory: .
        run: |
          cd "$RUNNER_TEMP" && rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q && git checkout -q -b fizika-ci-log
          cp "$LOG" ci.log 2>/dev/null || echo "jurnal yo'q" > ci.log
          echo "run ${{ github.run_id }} / ${{ github.sha }}" > run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "CI log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fizika-ci-log
