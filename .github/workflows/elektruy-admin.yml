# ElektrUy admin panel (elektruy/admin): lint, typecheck and production build.
# Deployment is done by Vercel (project root directory: elektruy/admin).
name: ElektrUy admin

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'elektruy/admin/**'
      - '.github/workflows/elektruy-admin.yml'
  pull_request:
    paths:
      - 'elektruy/admin/**'
      - '.github/workflows/elektruy-admin.yml'
  workflow_dispatch:

concurrency:
  group: elektruy-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: elektruy/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elektruy/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  publish-site:
    # energyvibe.uz is a static Vercel site without a build step, so the built panel
    # is committed to elektr-uy/admin/ (served at https://www.energyvibe.uz/elektr-uy/admin/).
    name: Publish to energyvibe.uz/elektr-uy/admin
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elektruy/admin/package-lock.json
      - name: Build for /elektr-uy/admin/
        working-directory: elektruy/admin
        env:
          ADMIN_BASE: /elektr-uy/admin/
        run: |
          npm ci
          npx vite build --outDir ../../elektr-uy/admin --emptyOutDir
      - name: Commit if changed
        run: |
          git add -A elektr-uy/admin
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "ElektrUy admin build for energyvibe.uz [skip actions]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
