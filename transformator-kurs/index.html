<style>
/* Layout: sticky input panel (left) + results header, sketches and A4-like report sheet (right); stacks on phones */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202e; --muted:#5b6878; --line:#d5dbe2;
  --copper:#b5621b; --copper-soft:#f6e6d6; --steel:#2e5f8f; --steel-soft:#dde8f3;
  --ok:#1f7a4d; --ok-bg:#e1f2e8; --warn:#9a6400; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe3e1;
  --paper:#ffffff; --paper-ink:#16181c; --paper-line:#c9ced6;
  --f-ui:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-doc:"PT Serif", "Times New Roman", Georgia, serif;
  --f-num:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3644;
  --copper:#e08a45; --copper-soft:#3a2716; --steel:#7fb0de; --steel-soft:#1b2c3e;
  --ok:#5fd09a; --ok-bg:#163326; --warn:#f0bd5a; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#3d1a18;
  --paper:#f7f8fa; --paper-ink:#16181c; --paper-line:#c9ced6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3644;
  --copper:#e08a45; --copper-soft:#3a2716; --steel:#7fb0de; --steel-soft:#1b2c3e;
  --ok:#5fd09a; --ok-bg:#163326; --warn:#f0bd5a; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#3d1a18;
  --paper:#f7f8fa; --paper-ink:#16181c; --paper-line:#c9ced6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crumb b{color:var(--copper);font-weight:600}
.crumb a.back{color:inherit;text-decoration:none}.crumb a.back:hover b{text-decoration:underline}
h1.title{font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h1.title span{color:var(--copper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-ui);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){aside.panel{position:static}}
.panel h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field label i{font-family:var(--f-doc);color:var(--ink)}
input,select{font:500 14px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num);font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
details{border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
details .body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid transparent;font:600 14px var(--f-ui);padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--copper);color:#fff}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--copper)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.55;cursor:progress}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sumhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.ttype{font-family:var(--f-num);font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1}
.tsub{color:var(--muted);font-size:13px;margin-top:6px}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{border-radius:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.chip .k{font-size:12px;color:var(--muted)}
.chip .v{font-family:var(--f-num);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.chip .d{font-size:12px;font-weight:600}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.chip.ok .d{color:var(--ok)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}.chip.warn .d{color:var(--warn)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.chip.bad .d{color:var(--bad)}
.msg{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--steel-soft);color:var(--ink)}
.msg[data-k="bad"]{background:var(--bad-bg)}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 30px rgba(20,30,45,.08);padding:clamp(18px,4vw,56px) clamp(16px,5vw,64px);font-family:var(--f-doc);font-size:16px;line-height:1.6;min-width:0}
.sheet .doc-h1{font-size:19px;font-weight:700;text-align:center;margin:30px 0 12px;text-wrap:balance}
.sheet .doc-h1:first-child{margin-top:0}
.sheet .doc-h2{font-size:17px;font-weight:700;margin:20px 0 8px}
.sheet p{margin:8px 0;text-align:justify;hyphens:auto}
.sheet .fm{margin:6px 0 6px 28px;font-style:italic;overflow-wrap:anywhere}
.sheet sub,.sheet sup{font-size:.7em;line-height:0}
.sheet .ck{margin:8px 0 8px 28px;padding:6px 10px;border-left:3px solid #1f7a4d;background:#eef7f1;font-size:15px}
.sheet .ck.no{border-left-color:#b3261e;background:#fbecea}
.sheet .tw{overflow-x:auto;margin:10px 0}
.sheet table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.sheet caption{caption-side:top;text-align:right;font-style:italic;padding-bottom:4px;font-size:14px}
.sheet th,.sheet td{border:1px solid var(--paper-line);padding:5px 8px;text-align:left;vertical-align:top}
.sheet th{background:#f1f3f6;font-weight:700}
.sheet figure{margin:16px 0;text-align:center}
.sheet figure .svgbox{overflow-x:auto}
.sheet figure svg{max-width:100%;height:auto}
.sheet figcaption{font-size:14.5px;margin-top:6px}
.sheet ol.lit{padding-left:22px;margin:6px 0}
.sheet ol.lit li{margin:4px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.chip,.sheet{transition:opacity .2s}}
.busy .sheet{opacity:.5}
</style>

</head>

<div class="wrap">
  <header class="top">
    <div class="brand">

  <div class="grid">

        <div class="field"><label for="mat" data-t="mat"></label><select id="mat"><option value="Cu"></option><option value="Al"></option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="U2"><i>U</i><sub>н2</sub> (<span data-t="hv"></span>), kV</label><select id="U2"><option>6</option><option>10</option><option>20</option><option>35</option></select></div>
        <div class="field"><label for="U1"><i>U</i><sub>н1</sub> (<span data-t="lv"></span>), kV</label><select id="U1"><option>0.23</option><option>0.4</option><option>0.69</option><option>3.15</option><option>6.3</option><option>10.5</option></select></div>
      </div>
      <div class="field"><label for="scheme" data-t="scheme"></label>
        <select id="scheme"><option value="Y/D-11">Y/Δ-11</option><option value="Y/Yn-0">Y/Yн-0</option><option value="D/Yn-11">Δ/Yн-11</option><option value="Yn/D-11">Yн/Δ-11</option><option value="Y/Y-0">Y/Y-0</option></select></div>
      <div class="row2">
        <div class="field"><label for="uk"><i>u</i><sub>к</sub>, %</label><input id="uk" type="number" step="0.1" min="2" max="15"></div>
        <div class="field"><label for="i0"><i>i</i><sub>о</sub>, %</label><input id="i0" type="number" step="0.1" min="0.1" max="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="Pk"><i>P</i><sub>к</sub>, <span data-t="W"></span></label><input id="Pk" type="number" step="100" min="100"></div>
        <div class="field"><label for="P0"><i>P</i><sub>х</sub>, <span data-t="W"></span></label><input id="P0" type="number" step="10" min="10"></div>
      </div>
      <details>
        <summary data-t="adv"></summary>
        <div class="body">
          <div class="field"><label for="teacher" data-t="teacher"></label><input id="teacher" type="text" autocomplete="off"></div>
          <div class="row3">
            <div class="field"><label for="ovd"><i>d</i>, m</label><select id="ovd"></select></div>
            <div class="field"><label for="ovw"><i>w</i><sub>1</sub></label><input id="ovw" type="number" min="1" step="1" placeholder="auto"></div>
            <div class="field"><label for="ovB"><i>B</i><sub>с</sub>, T</label><input id="ovB" type="number" min="1.3" max="1.75" step="0.01" placeholder="1.6"></div>
          </div>
          <p class="hint" data-t="advHint"></p>
        </div>
      </details>
      <button type="button" class="btn primary" id="run"><span data-t="run"></span></button>
      <p class="hint" data-t="method"></p>
    </aside>

    <main id="main">
      <section class="summary" aria-live="polite">
        <div class="sumhead">
          <div>
            <div class="ttype" id="ttype">ТМ</div>
            <div class="tsub" id="tsub"></div>
          </div>
          <div class="dl">
            <button type="button" class="btn ghost" id="dl-uz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Word · UZ</button>
            <button type="button" class="btn ghost" id="dl-ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Word · RU</button>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="msg" id="msg" hidden></div>
      </section>
      <article class="sheet" id="sheet"></article>
      <p class="foot" data-t="foot"></p>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script>
<script>
/* Расчёт трёхфазного двухобмоточного масляного трансформатора
   по методике П.М. Тихомирова (1986) и метод. указаниям ТашГТУ (Пирматов, Якубова, 2022).
   Индекс 1 — обмотка НН, индекс 2 — обмотка ВН. */
(function (root) {
  'use strict';
  var SQ3 = Math.sqrt(3), SQ2 = Math.sqrt(2), PI = Math.PI;

  function interp(tab, x) { // tab: [[x,y],...] sorted by x
    if (x <= tab[0][0]) return tab[0][1];
    for (var i = 1; i < tab.length; i++) {
      if (x <= tab[i][0]) {
        var x0 = tab[i - 1][0], y0 = tab[i - 1][1], x1 = tab[i][0], y1 = tab[i][1];
        return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
    }
    return tab[tab.length - 1][1];
  }
  function ceilTo(x, s) { return Math.ceil(x / s - 1e-9) * s; }

  // ---------- Таблицы ----------
  // Табл.1 Испытательные напряжения (класс, кВ -> Uисп, кВ)
  var T1 = [[3, 18], [6, 25], [10, 35], [15, 45], [20, 55], [35, 85]];
  function voltClass(kv) {
    var cls = [[3.6, 3], [7.2, 6], [12, 10], [17.5, 15], [24, 20], [40.5, 35]];
    for (var i = 0; i < cls.length; i++) if (kv <= cls[i][0]) return cls[i][1];
    return 35;
  }
  function testVoltage(kv) {
    if (kv <= 1) return 5;
    var c = voltClass(kv);
    for (var i = 0; i < T1.length; i++) if (T1[i][0] === c) return T1[i][1];
    return 85;
  }
  // Табл.2 Главная изоляция ВН
  function table2(S, Uisp) {
    if (Uisp <= 35) {
      if (S <= 100) return { l02: 20, dsh: 0, a12: 9, d12: 2.5, lc2: 10, a22: 8, d22: 0, row: '25-100' };
      if (S <= 630) return { l02: 30, dsh: 0, a12: 9, d12: 3, lc2: 15, a22: 10, d22: 0, row: '160-630' };
      return { l02: 50, dsh: 0, a12: 20, d12: 4, lc2: 20, a22: 18, d22: 0, row: '1000-6300' };
    }
    if (Uisp <= 45) return { l02: 50, dsh: 2, a12: 20, d12: 4, lc2: 20, a22: 18, d22: 2, row: '630 и выше' };
    if (Uisp <= 55) return { l02: 50, dsh: 2, a12: 20, d12: 5, lc2: 30, a22: 20, d22: 3, row: '630 и выше' };
    if (S <= 630) return { l02: 75, dsh: 2, a12: 27, d12: 5, lc2: 50, a22: 20, d22: 3, row: '160-630' };
    if (S <= 6300) return { l02: 75, dsh: 2, a12: 27, d12: 5, lc2: 50, a22: 30, d22: 3, row: '1000-6300' };
    return { l02: 80, dsh: 3, a12: 30, d12: 6, lc2: 50, a22: 30, d22: 3, row: '10000 и выше' };
  }
  // Табл.3 Главная изоляция НН (винтовая обмотка)
  function table3(S, Uisp1) {
    if (Uisp1 <= 5) return { d01: 4, ac1: 6, a01: 15, lc1: 18, row: '1000-2500' };
    if (Uisp1 <= 35) return S <= 1600 ? { d01: 4, ac1: 6, a01: 15, lc1: 25, row: '630-1600' } : { d01: 4, ac1: 8, a01: 17.5, lc1: 25, row: '2500-6300' };
    if (Uisp1 <= 45) return { d01: 5, ac1: 10, a01: 20, lc1: 30, row: '630 и выше' };
    if (Uisp1 <= 55) return { d01: 5, ac1: 13, a01: 23, lc1: 45, row: '630 и выше' };
    return { d01: 6, ac1: 19, a01: 30, lc1: 70, row: 'все мощности' };
  }
  // Табл.4 коэффициент k для (a1+a2)/3
  function table4(S, cls) {
    var k;
    if (cls <= 10) {
      if (S <= 250) k = 0.63; else if (S <= 630) k = 0.53;
      else k = interp([[1000, 0.51], [2500, 0.51], [4000, 0.47], [6300, 0.45], [10000, 0.43]], S);
    } else {
      if (S <= 250) k = 0.62; else if (S <= 630) k = 0.55;
      else k = interp([[1000, 0.52], [2500, 0.51], [4000, 0.50], [6300, 0.48], [10000, 0.47]], S);
    }
    return k;
  }
  // Табл.7 kд
  function table7range(S) {
    if (S <= 100) return [0.97, 0.97]; if (S <= 630) return [0.93, 0.96]; if (S <= 6300) return [0.85, 0.93];
    if (S <= 16000) return [0.82, 0.84]; return [0.80, 0.82];
  }
  function table7(S) { return interp([[100, 0.97], [160, 0.96], [630, 0.93], [1000, 0.92], [2500, 0.91], [4000, 0.88], [6300, 0.86], [10000, 0.84]], S); }
  // Табл.8 a = d12/d
  function table8(S, cls) {
    if (cls <= 10) return S <= 630 ? 1.36 : 1.38;
    return S <= 6300 ? 1.40 : 1.40;
  }
  // Табл.9 b = 2a2/d
  function table9(S, cls) {
    if (cls <= 10) {
      if (S <= 250) return 0.55; if (S <= 630) return 0.43;
      return interp([[1000, 0.26], [2500, 0.25], [6300, 0.24]], S);
    }
    if (S <= 630) return 0.42;
    if (S <= 6300) return interp([[1000, 0.32], [6300, 0.28]], S);
    return 0.26;
  }
  // Табл.5 рекомендуемая индукция (сталь 3405, масляные)
  function table5(S) { return S <= 16 ? 1.52 : (S <= 100 ? 1.58 : 1.60); }
  // Табл.6 kз: 3405, 0,30 мм, нагревостойкое + однократная лакировка
  var KZ = 0.955;
  // Табл.2.5 (Тихомиров) число ступеней и kкр по диаметру
  function kkrByD(d) {
    var t = [[0.18, 6, 0.913], [0.20, 7, 0.918], [0.23, 8, 0.928], [0.27, 8, 0.925], [0.31, 8, 0.928], [0.35, 9, 0.929],
      [0.39, 9, 0.913], [0.44, 11, 0.922], [0.52, 14, 0.927], [0.59, 15, 0.927], [0.70, 16, 0.929], [9, 16, 0.931]];
    for (var i = 0; i < t.length; i++) if (d <= t[i][0] + 1e-9) return { steps: t[i][1], kkr: t[i][2] };
    return { steps: 16, kkr: 0.931 };
  }
  // Табл.16 Пф.с, Пф.я (см2), Vу (см3) без прессующей пластины
  var T16 = [[0.19, 262.8, 267.3, 4118], [0.20, 288.4, 296.2, 4811], [0.21, 319.2, 327.2, 5680], [0.22, 353.0, 360.5, 6460],
    [0.23, 387.7, 394.0, 7482], [0.24, 419.3, 425.6, 8428], [0.25, 456.2, 462.6, 9532], [0.26, 490.6, 507.1, 10746],
    [0.27, 532.6, 543.4, 12018], [0.28, 570.9, 591.1, 13738], [0.29, 612.4, 622.8, 14858], [0.30, 657.2, 675.2, 16556],

    f('J_{1} = I_{ф1}/П_{1} = ' + N(e.If1, 1) + '/(' + N(lv.P1, 1) + '·10^{-6}) = ' + N(lv.J1 / 1e6, 3) + ' ' + u.MAm2);
    p('Высота (осевой размер) обмотки:', "Chulg'am balandligi (o'q bo'yicha o'lchami):");
    if (lv.kh === 1) f('l_{1} = [b\'·(w_{1} + 4) + 0,95·h_{к}·(w_{1} + 3)]·10^{-3} = [' + N(lv.bp, 2) + '·(' + lv.w1 + ' + 4) + 0,95·5·(' + lv.w1 + ' + 3)]·10^{-3} = ' + N(lv.l1, 3) + ' ' + u.m);
    else {
      var G = lv.kh * (lv.w1 + 1), ch = G - 1, n10 = Math.min(6, ch);
      f('l_{1} = ' + lv.kh + '·(w_{1} + 1)·b\'·10^{-3} + [(' + lv.kh + '·w_{1} + ' + (lv.kh - 1) + ' − 6)·h_{к} + 10·6]·0,95·10^{-3} = ' + G + '·' + N(lv.bp, 2) + '·10^{-3} + [' + (ch - n10) + '·5 + 60]·0,95·10^{-3} = ' + N(lv.l1, 3) + ' ' + u.m);
      p('Для частичной компенсации разрыва в обмотке ВН при регулировании напряжения в середине высоты обмотки НН размещено шесть радиальных каналов по 10 мм.',
        "Kuchlanishni rostlashda YuK chulg'amidagi uzilishni qisman kompensatsiyalash uchun PK chulg'ami balandligining o'rtasida 10 mm li oltita radial kanal joylashtirilgan.");
    }
    p('Радиальный размер обмотки:', "Chulg'amning radial o'lchami:");
    f('a_{1} = (n_{эл}/' + lv.kh + ')·a\' = ' + w.ng + '·' + N(lv.ap, 2) + '·10^{-3} = ' + N(lv.a1, 4) + ' ' + u.m);
    p('Внутренний, внешний и средний диаметры обмотки:', "Chulg'amning ichki, tashqi va o'rtacha diametrlari:");
    f('D\'_{1} = d + 2·a_{01} = ' + N(m.d, 2) + ' + 2·' + N(ins1.a01 / 1000, 4) + ' = ' + N(lv.D1i, 4) + ' ' + u.m);
    f('D\'\'_{1} = D\'_{1} + 2·a_{1} = ' + N(lv.D1i, 4) + ' + 2·' + N(lv.a1, 4) + ' = ' + N(lv.D1o, 4) + ' ' + u.m);
    f('D_{ср1} = (D\'_{1} + D\'\'_{1})/2 = (' + N(lv.D1i, 4) + ' + ' + N(lv.D1o, 4) + ')/2 = ' + N(lv.D1s, 4) + ' ' + u.m);
    p('Обмотка наматывается на рейках на бумажно-бакелитовом цилиндре размерами:', "Chulg'am qog'oz-bakelit silindrdagi reykalarga o'raladi, silindr o'lchamlari:");
    f('⌀ ' + N(lv.cyl.Din, 3) + '/' + N(lv.cyl.Dout, 3) + ' × ' + N(lv.cyl.h, 3) + ' ' + u.m + '  (⌀ (d + a_{01})/(d + a_{01} + 2δ_{01}) × (l_{1} + 2l_{ц1}))');
    p('Коэффициент добавочных потерь от поля рассеяния (формула 7.14 [1]):', "Sochilish maydonidan qo'shimcha isroflar koeffitsienti ([1] dagi 7.14-formula):");
    f('β_{д} = b·m·k_{р}/l = ' + N(w.b / 1000, 4) + '·' + w.m + '·0,95/' + N(lv.l1, 3) + ' = ' + N(w.bd, 3));
    f('k_{д1} = 1 + ' + (Cu ? '0,095' : '0,037') + '·10^{8}·β_{д}^{2}·a^{4}·n^{2} = 1 + ' + (Cu ? '0,095' : '0,037') + '·10^{8}·' + N(w.bd, 3) + '^{2}·(' + N(w.a / 1000, 5) + ')^{4}·' + w.ng + '^{2} = ' + N(lv.kad, 3));
    p('Плотность теплового потока на поверхности обмотки (k_{з} = 0,8 — коэффициент закрытия поверхности, w_{к} = ' + N(1 / lv.kh, 2) + '):',
      "Chulg'am sirtidagi issiqlik oqimi zichligi (k_{з} = 0,8 — sirtning yopilish koeffitsienti, w_{к} = " + N(1 / lv.kh, 2) + '):');
    f('q_{1} = ' + (Cu ? '107' : '172') + '·J_{1}·I_{ф1}·w_{к}·k_{д1}/(k_{з}·(b\' + a_{1}))·10^{-10} = ' + (Cu ? '107' : '172') + '·' + N(lv.J1 / 1e6, 3) + '·10^{6}·' + N(e.If1, 1) + '·' + N(1 / lv.kh, 2) + '·' + N(lv.kad, 3) + '/(0,8·(' + N(lv.bp / 1000, 4) + ' + ' + N(lv.a1, 4) + '))·10^{-10} = ' + N(lv.q1, 0) + ' ' + u.Wm2);
    chk(lv.q1 <= 1400, lv.q1 <= 1400 ? 'q_{1} ≤ 1400 Вт/м^{2} — допустимо при естественном масляном охлаждении' : 'q_{1} > 1400 Вт/м^{2} — тепловой поток повышен',
      lv.q1 <= 1400 ? "q_{1} ≤ 1400 Vt/m^{2} — tabiiy moyli sovutishda ruxsat etiladi" : "q_{1} > 1400 Vt/m^{2} — issiqlik oqimi yuqori");
    p('Масса металла обмотки НН (c = 3 — число активных стержней):', "PK chulg'ami metallining massasi (c = 3 — aktiv sterjenlar soni):");
    f('G_{о1} = ' + cg + '·c·D_{ср1}·w_{1}·П_{1} = ' + cg + '·3·' + N(lv.D1s, 4) + '·' + lv.w1 + '·' + N(lv.P1, 1) + '·10^{-6} = ' + N(lv.Go1, 1) + ' ' + u.kg);
    p('Масса провода с изоляцией (увеличение по табл. 11 — ' + N(lv.insPct) + ' %):', "Izolyatsiyali sim massasi (11-jadval bo'yicha oshish — " + N(lv.insPct) + ' %):');
    f('G_{пр1} = ' + N(1 + lv.insPct / 100, 3) + '·' + N(lv.Go1, 1) + ' = ' + N(lv.Gpr1, 1) + ' ' + u.kg);

    // ---------- 5 ВН ----------
    h1('Расчёт обмотки ВН', "YuK chulg'amini hisoblash");
    p('Регулирование напряжения ПБВ ±2×2,5 %: концы всех трёх фаз обмотки выведены к одному трёхфазному переключателю, регулировочные витки расположены в середине высоты обмотки. Контакты переключателя рассчитываются на рабочий ток I_{2} = ' + N(e.I2, 1) + ' А. Наибольшее напряжение между контактами переключателя в одной фазе:',
      "PBV ±2×2,5 % kuchlanishni rostlash: barcha uch faza chulg'ami uchlari bitta uch fazali o'zgartirgichga chiqarilgan, rostlash o'ramlari chulg'am balandligining o'rtasida joylashgan. O'zgartirgich kontaktlari ishchi tok I_{2} = " + N(e.I2, 1) + " A ga hisoblanadi. Bir fazada o'zgartirgich kontaktlari orasidagi eng katta kuchlanish:");
    f(L('рабочее', 'ishchi') + ' 10 %·U_{ф2} = ' + N(hv.Uswork, 0) + ' ' + u.V + ';   ' + L('испытательное', 'sinov') + ' 2·10 %·U_{ф2} = ' + N(hv.Ustest, 0) + ' ' + u.V);
    p('Число витков обмотки ВН при номинальном напряжении и на одной ступени регулирования:', "Nominal kuchlanishdagi va bir rostlash pog'onasidagi YuK chulg'ami o'ramlar soni:");
    f('w_{н2} = w_{1}·U_{ф2}/U_{ф1} = ' + lv.w1 + '·' + N(e.Uf2, 0) + '/' + N(e.Uf1, 1) + ' = ' + N(lv.w1 * e.Uf2 / e.Uf1, 1) + ' ≈ ' + hv.wn2 + ' ' + u.turns);
    f('w_{р} = 0,025·U_{ф2}/U_{в} = 0,025·' + N(e.Uf2, 0) + '/' + N(lv.Uv, 3) + ' = ' + N(0.025 * e.Uf2 / lv.Uv, 2) + ' ≈ ' + hv.wp + ' ' + u.turns);
    tbl(L('Число витков на ответвлениях', "Tarmoqlardagi o'ramlar soni"), [L('Напряжение', 'Kuchlanish'), u.V, L('Число витков', "O'ramlar soni")], hv.taps.map(function (t) {
      var lab = t[0] === 0 ? 'U_{н2}' : 'U_{н2} ' + (t[0] > 0 ? '+ ' : '− ') + N(Math.abs(t[0])) + ' %';
      var expr = t[0] === 0 ? hv.wn2 + ' = w_{н2}' : hv.wn2 + (t[0] > 0 ? ' + ' : ' − ') + (Math.abs(t[0]) === 5 ? '2·' : '') + hv.wp + ' = ' + t[1] + (t[0] === 5 ? ' = w_{2max}' : '');
      return [lab, N(e.Uvn * (1 + t[0] / 100), 0), expr];
    }));
    p('Ориентировочная плотность тока и сечение витка:', "Taxminiy tok zichligi va o'ram kesimi:");
    f('J\'_{2} = 2·J_{ср} − J_{1} = 2·' + N(lv.Jsr / 1e6, 3) + ' − ' + N(lv.J1 / 1e6, 3) + ' = ' + N(hv.J2p / 1e6, 3) + ' ' + u.MAm2);
    f('П\'_{2} = I_{ф2}/J\'_{2} = ' + N(e.If2, 2) + '/(' + N(hv.J2p / 1e6, 3) + '·10^{6}) = ' + N(hv.P2p, 2) + ' ' + u.mm2);
    var hw = hv.wire;
    if (hv.type === 'disc') {
      p('По табл. 2 выбираем непрерывную катушечную обмотку из медного прямоугольного провода. По сортаменту обмоточного провода (табл. 5.2 [1]) выбираем провод марки ПБ:',
        "2-jadval bo'yicha to'g'ri burchakli simdan uzluksiz g'altakli chulg'amni tanlaymiz. Chulg'am simi sortamentidan ([1] dagi 5.2-jadval) PB markali simni tanlaymiz:");
      f(L('ПБ', 'PB') + ' ' + hw.np + '×(' + N(hw.a, 2) + '×' + N(hw.b, 2) + ')/(' + N(hv.ap2, 2) + '×' + N(hv.bp2, 2) + ');   П_{2} = ' + hw.np + '·' + N(hw.s1, 2) + ' = ' + N(hv.P2, 2) + ' ' + u.mm2);
      f('J_{2} = I_{ф2}/П_{2} = ' + N(e.If2, 2) + '/(' + N(hv.P2, 2) + '·10^{-6}) = ' + N(hv.J2 / 1e6, 3) + ' ' + u.MAm2);
      if (e.cls2 >= 35) p('Так как U_{н2} ≥ 35 кВ, в двух верхних и двух нижних катушках каждой фазы применяем провод с усиленной изоляцией: (a\' + 1)×(b\' + 1) = ' + N(hv.ap2 + 1, 2) + '×' + N(hv.bp2 + 1, 2) + ' мм; эти катушки отделены каналами по 7,5 мм.',
        "U_{н2} ≥ 35 kV bo'lgani uchun har bir fazaning ikkita yuqori va ikkita pastki g'altagida kuchaytirilgan izolyatsiyali simni qo'llaymiz: (a' + 1)×(b' + 1) = " + N(hv.ap2 + 1, 2) + '×' + N(hv.bp2 + 1, 2) + " mm; bu g'altaklar 7,5 mm li kanallar bilan ajratilgan.");
      p('Принимаем радиальные каналы h\'_{к} = 5 мм между всеми катушками; канал в месте разрыва обмотки (регулировочная зона) h_{кр} = ' + hv.hkr + ' мм (табл. 12). Число катушек на стержне:',
        "Barcha g'altaklar orasida h'_{к} = 5 mm radial kanallarni qabul qilamiz; chulg'am uzilishi joyidagi (rostlash zonasi) kanal h_{кр} = " + hv.hkr + " mm (12-jadval). Sterjendagi g'altaklar soni:");
      f('n_{кат} ≈ l·10^{3}/(b\'_{2} + h\'_{к}) ≈ ' + N(m.l * 0 + lv.l1 * 1000, 0) + '/(' + N(hv.bp2, 2) + ' + 5) ≈ ' + hv.nk + ' ' + u.coils);
      f('w_{кат} = w_{2max}/n_{кат} = ' + hv.w2max + '/' + hv.nk + ' = ' + N(hv.w2max / hv.nk, 2));
      tbl(L('Распределение витков по катушкам', "O'ramlarning g'altaklar bo'yicha taqsimlanishi"), [L('Катушки', "G'altaklar"), L('Кол-во', 'Soni'), L('Витков в катушке', "G'altakdagi o'ramlar"), L('Всего витков', "Jami o'ramlar")],
        hv.dist.map(function (dd) { return [dd.kind === 'main' ? L('основные', 'asosiy') : L('регулировочные', 'rostlovchi'), dd.n, dd.w, dd.n * dd.w]; })
          .concat([[L('Всего', 'Jami'), hv.nk, '—', hv.w2max]]));
      p('Радиальный размер обмотки:', "Chulg'amning radial o'lchami:");
      f('a_{2} = n_{пр}·a\'·w_{кат.max} = ' + hw.np + '·' + N(hv.ap2, 2) + '·' + hw.wm + '·10^{-3} = ' + N(hv.a2, 4) + ' ' + u.m);
      p('Осевой размер (высота) обмотки ВН:', "YuK chulg'amining o'q bo'yicha o'lchami (balandligi):");
      if (e.cls2 >= 35) f('l_{2} = [b\'_{2}·(n_{кат} − 4) + b\'\'_{2}·4 + 0,95·(h_{кр} + 2·7,5 + h\'_{к}·(n_{кат} − 4))]·10^{-3} = [' + N(hv.bp2, 2) + '·' + (hv.nk - 4) + ' + ' + N(hv.bp2 + 1, 2) + '·4 + 0,95·(' + hv.hkr + ' + 15 + 5·' + (hv.nk - 4) + ')]·10^{-3} = ' + N(hv.l2, 3) + ' ' + u.m);
      else f('l_{2} = [n_{кат}·b\'_{2} + 0,95·(h_{кр} + h\'_{к}·(n_{кат} − 2))]·10^{-3} = [' + hv.nk + '·' + N(hv.bp2, 2) + ' + 0,95·(' + hv.hkr + ' + 5·' + (hv.nk - 2) + ')]·10^{-3} = ' + N(hv.l2, 3) + ' ' + u.m);
    } else {
      p('Ток фазы ВН мал (П\'_{2} < 5 мм^{2}), поэтому по табл. 2 выбираем многослойную цилиндрическую обмотку из круглого медного провода марки ПБ (изоляция 0,30 мм на две стороны):',
        "YuK faza toki kichik (П'_{2} < 5 mm^{2}), shuning uchun 2-jadval bo'yicha PB markali dumaloq mis simdan (ikki tomonga izolyatsiya 0,30 mm) ko'p qatlamli silindrik chulg'amni tanlaymiz:");
      f(L('ПБ', 'PB') + ' ' + hw.np + '×⌀' + N(hw.dw, 2) + '/' + N(hw.dp, 2) + ';   П_{2} = ' + hw.np + '·π·' + N(hw.dw, 2) + '^{2}/4 = ' + N(hv.P2, 3) + ' ' + u.mm2);
      f('J_{2} = I_{ф2}/П_{2} = ' + N(e.If2, 2) + '/(' + N(hv.P2, 3) + '·10^{-6}) = ' + N(hv.J2 / 1e6, 3) + ' ' + u.MAm2);
      p('Число витков в слое и число слоёв:', "Qatlamdagi o'ramlar soni va qatlamlar soni:");
      f('w_{сл} = l·10^{3}/(n_{пр}·d\') − 1 = ' + N(lv.l1 * 1000, 0) + '/(' + hw.np + '·' + N(hw.dp, 2) + ') − 1 ≈ ' + hw.wsl);
      f('n_{сл} = w_{2max}/w_{сл} = ' + hv.w2max + '/' + hw.wsl + ' = ' + N(hv.w2max / hw.wsl, 2) + ' → ' + hw.nsl);
      p('Рабочее напряжение двух слоёв и междуслойная изоляция (кабельная бумага по 0,12 мм):', "Ikki qatlamning ishchi kuchlanishi va qatlamlararo izolyatsiya (0,12 mm li kabel qog'ozi):");
      f('U_{мсл} = 2·w_{сл}·U_{в} = 2·' + hw.wsl + '·' + N(lv.Uv, 3) + ' = ' + N(hw.Umsl, 0) + ' ' + u.V + ';   δ_{мсл} = ' + hw.nsh + '×0,12 = ' + N(hw.dmsl, 2) + ' ' + u.mm);
      if (hw.ch) p('Обмотка разделена на две концентрические части с осевым масляным каналом a\'_{22} = 6 мм.', "Chulg'am o'q bo'ylab 6 mm li moy kanali bilan ikki konsentrik qismga bo'lingan.");
      p('Радиальный размер обмотки и её высота:', "Chulg'amning radial o'lchami va balandligi:");
      f('a_{2} = [d\'·n_{сл} + δ_{мсл}·(n_{сл} − 1)' + (hw.ch ? ' + a\'_{22}' : '') + ']·10^{-3} = [' + N(hw.dp, 2) + '·' + hw.nsl + ' + ' + N(hw.dmsl, 2) + '·' + (hw.nsl - 1) + (hw.ch ? ' + 6' : '') + ']·10^{-3} = ' + N(hv.a2, 4) + ' ' + u.m);
      f('l_{2} = n_{пр}·d\'·(w_{сл} + 1)·10^{-3} = ' + hw.np + '·' + N(hw.dp, 2) + '·' + (hw.wsl + 1) + '·10^{-3} = ' + N(hv.l2, 3) + ' ' + u.m);
    }
    chk(Math.abs(hv.l2 - lv.l1) / lv.l1 < 0.03, 'Высоты обмоток ВН и НН практически равны (l_{2} = ' + N(hv.l2, 3) + ' м, l_{1} = ' + N(lv.l1, 3) + ' м)',
      "YuK va PK chulg'amlarining balandliklari deyarli teng (l_{2} = " + N(hv.l2, 3) + ' m, l_{1} = ' + N(lv.l1, 3) + ' m)');
    p('Диаметры обмотки ВН:', "YuK chulg'amining diametrlari:");
    f('D\'_{2} = D\'\'_{1} + 2·a_{12} = ' + N(lv.D1o, 4) + ' + 2·' + N(ins2.a12 / 1000, 3) + ' = ' + N(hv.D2i, 4) + ' ' + u.m);
    f('D\'\'_{2} = D\'_{2} + 2·a_{2} = ' + N(hv.D2i, 4) + ' + 2·' + N(hv.a2, 4) + ' = ' + N(hv.D2o, 4) + ' ' + u.m);
    f('D_{ср2} = (D\'_{2} + D\'\'_{2})/2 = ' + N(hv.D2s, 4) + ' ' + u.m);
    p('Обмотка ВН наматывается на бумажно-бакелитовом цилиндре:', "YuK chulg'ami qog'oz-bakelit silindrga o'raladi:");
    f('⌀ ' + N(hv.cyl.Din, 3) + '/' + N(hv.cyl.Dout, 3) + ' × ' + N(hv.cyl.h, 3) + ' ' + u.m + '  (⌀ (D\'\'_{1} + a_{12})/(D\'\'_{1} + a_{12} + 2δ_{12}) × (l + 2l_{ц2}))');
    p('Коэффициент добавочных потерь обмотки ВН:', "YuK chulg'amining qo'shimcha isroflar koeffitsienti:");
    if (hv.type === 'disc') {
      f('β_{д} = b·n_{кат}·k_{р}/l = ' + N(hw.b / 1000, 4) + '·' + hv.nk + '·0,95/' + N(lv.l1, 3) + ' = ' + N(hw.bd, 3));
      f('k_{д2} = 1 + ' + (Cu ? '0,095' : '0,037') + '·10^{8}·β_{д}^{2}·a^{4}·n^{2} = 1 + ' + (Cu ? '0,095' : '0,037') + '·10^{8}·' + N(hw.bd, 3) + '^{2}·(' + N(hw.a / 1000, 5) + ')^{4}·' + (hw.np * hw.wm) + '^{2} = ' + N(hv.kad, 3));
      p('Плотность теплового потока на поверхности катушки ВН:', "YuK g'altagi sirtidagi issiqlik oqimi zichligi:");
      f('q_{2} = ' + (Cu ? '107' : '172') + '·J_{2}·I_{ф2}·w_{кат}·k_{д2}/(k_{з}·(b\'_{2} + a_{2}))·10^{-10} = ' + (Cu ? '107' : '172') + '·' + N(hv.J2 / 1e6, 3) + '·10^{6}·' + N(e.If2, 2) + '·' + hv.wk + '·' + N(hv.kad, 3) + '/(0,8·(' + N(hv.bp2 / 1000, 4) + ' + ' + N(hv.a2, 4) + '))·10^{-10} = ' + N(hv.q2, 0) + ' ' + u.Wm2);
    } else {
      f('β_{д} = d·w_{сл}·n_{пр}·k_{р}/l = ' + N(hw.dw / 1000, 5) + '·' + hw.wsl + '·' + hw.np + '·0,95/' + N(lv.l1, 3) + ' = ' + N(hw.bd, 3));
      f('k_{д2} = 1 + ' + (Cu ? '0,044' : '0,017') + '·10^{8}·β_{д}^{2}·d^{4}·n_{сл}^{2} = ' + N(hv.kad, 4));
      p('Плотность теплового потока на охлаждаемой поверхности обмотки ВН:', "YuK chulg'amining sovutiladigan sirtidagi issiqlik oqimi zichligi:");
      f('q_{2} = P_{осн2}·k_{д2}/П_{о2} = ' + N(sc.Pos2, 0) + '·' + N(hv.kad, 3) + '/' + N(hv.Pi02, 3) + ' = ' + N(hv.q2, 0) + ' ' + u.Wm2);
    }
    p('Масса металла обмотки ВН:', "YuK chulg'ami metallining massasi:");
    f('G_{о2} = ' + cg + '·c·D_{ср2}·w_{2max}·П_{2} = ' + cg + '·3·' + N(hv.D2s, 4) + '·' + hv.w2max + '·' + N(hv.P2, 3) + '·10^{-6} = ' + N(hv.Go2, 1) + ' ' + u.kg);
    f('G_{пр2} = ' + N(1 + hv.insPct / 100, 3) + '·' + N(hv.Go2, 1) + ' = ' + N(hv.Gpr2, 1) + ' ' + u.kg);
    p('Масса металла и провода двух обмоток:', "Ikki chulg'am metali va simining massasi:");
    f('G_{о} = G_{о1} + G_{о2} = ' + N(lv.Go1, 1) + ' + ' + N(hv.Go2, 1) + ' = ' + N(R.G.Go, 1) + ' ' + u.kg + ';   G_{пр} = ' + N(lv.Gpr1, 1) + ' + ' + N(hv.Gpr2, 1) + ' = ' + N(R.G.Gpr, 1) + ' ' + u.kg);

    // ---------- 6 КЗ ----------
    h1('Расчёт параметров короткого замыкания', 'Qisqa tutashuv parametrlarini hisoblash');
    h2('Потери короткого замыкания', 'Qisqa tutashuv isroflari');
    p('Основные потери в обмотках:', "Chulg'amlardagi asosiy isroflar:");
    f(L('НН', 'PK') + ': P_{осн1} = ' + kpos + '·J_{1}^{2}·G_{о1} = ' + kpos + '·(' + N(lv.J1 / 1e6, 3) + '·10^{6})^{2}·' + N(lv.Go1, 1) + ' = ' + N(sc.Pos1, 0) + ' ' + u.W);
    f(L('ВН', 'YuK') + ': P_{осн2} = ' + kpos + '·J_{2}^{2}·G_{о2} = ' + kpos + '·(' + N(hv.J2 / 1e6, 3) + '·10^{6})^{2}·' + N(hv.Go2, 1) + ' = ' + N(sc.Pos2, 0) + ' ' + u.W);
    p('Коэффициенты добавочных потерь (см. расчёт обмоток): k_{д1} = ' + N(sc.kd1, 3) + ', k_{д2} = ' + N(sc.kd2, 3) + '.', "Qo'shimcha isroflar koeffitsientlari (chulg'amlar hisobiga qarang): k_{д1} = " + N(sc.kd1, 3) + ', k_{д2} = ' + N(sc.kd2, 3) + '.');
    p('Длина отводов определяется приближённо: при соединении в звезду l_{отв} = 7,5·l, в треугольник l_{отв} = 14·l. Плотность металла отводов γ = ' + sc.gam + ' кг/м^{3}.',
      "Otvodlar uzunligi taxminan aniqlanadi: yulduz ulanishda l_{отв} = 7,5·l, uchburchakda l_{отв} = 14·l. Otvodlar metalining zichligi γ = " + sc.gam + ' kg/m^{3}.');
    f('l_{отв1} = ' + (lvY ? '7,5' : '14') + '·' + N(lv.l1, 3) + ' = ' + N(sc.lotv1, 2) + ' ' + u.m + ';   l_{отв2} = ' + (hvY ? '7,5' : '14') + '·' + N(lv.l1, 3) + ' = ' + N(sc.lotv2, 2) + ' ' + u.m);
    f('G_{отв1} = l_{отв1}·П_{1}·γ = ' + N(sc.lotv1, 2) + '·' + N(lv.P1, 1) + '·10^{-6}·' + sc.gam + ' = ' + N(sc.Gotv1, 2) + ' ' + u.kg);
    f('P_{отв1} = ' + kpos + '·J_{1}^{2}·G_{отв1} = ' + N(sc.Potv1, 1) + ' ' + u.W);
    f('G_{отв2} = l_{отв2}·П_{2}·γ = ' + N(sc.lotv2, 2) + '·' + N(hv.P2, 3) + '·10^{-6}·' + sc.gam + ' = ' + N(sc.Gotv2, 3) + ' ' + u.kg);
    f('P_{отв2} = ' + kpos + '·J_{2}^{2}·G_{отв2} = ' + N(sc.Potv2, 2) + ' ' + u.W);
    p('Потери в стенках бака и других элементах конструкции (k по табл. 13):', "Bak devorlari va boshqa konstruksiya elementlaridagi isroflar (k — 13-jadvaldan):");
    f('P_{б} = 10·k·S_{н} = 10·' + N(sc.kb, 4) + '·' + N(S) + ' = ' + N(sc.Pb, 0) + ' ' + u.W);
    p('Полные потери короткого замыкания:', "Qisqa tutashuvning to'liq isroflari:");
    f('P\'_{к} = P_{осн1}·k_{д1} + P_{осн2}·k_{д2} + P_{отв1} + P_{отв2} + P_{б} = ' + N(sc.Pos1, 0) + '·' + N(sc.kd1, 3) + ' + ' + N(sc.Pos2, 0) + '·' + N(sc.kd2, 3) + ' + ' + N(sc.Potv1, 1) + ' + ' + N(sc.Potv2, 2) + ' + ' + N(sc.Pb, 0) + ' = ' + N(sc.Pkp, 0) + ' ' + u.W);
    p('Для номинального напряжения обмотки ВН:', "YuK chulg'amining nominal kuchlanishi uchun:");
    f('P\'_{кн} = P\'_{к} − 0,05·P_{осн2}·k_{д2} = ' + N(sc.Pkp, 0) + ' − 0,05·' + N(sc.Pos2, 0) + '·' + N(sc.kd2, 3) + ' = ' + N(sc.Pkn, 0) + ' ' + u.W);
    chk(sc.Pkdev <= 110, 'P\'_{кн} составляет ' + dev(sc.Pkdev) + ' заданного значения (допуск ГОСТ 11677-85: +10 %)', "P'_{кн} berilgan qiymatning " + dev(sc.Pkdev) + ' ini tashkil etadi (GOST 11677-85 ruxsatnomasi: +10 %)');
    h2('Напряжение короткого замыкания', 'Qisqa tutashuv kuchlanishi');
    p('Активная составляющая:', 'Aktiv tashkil etuvchi:');
    f('u_{а} = P\'_{кн}/(10·S_{н}) = ' + N(sc.Pkn, 0) + '/(10·' + N(S) + ') = ' + N(sc.ua, 3) + ' %');
    p('Реактивная составляющая:', 'Reaktiv tashkil etuvchi:');
    f('a_{р} = a_{12} + (a_{1} + a_{2})/3 = ' + N(ins2.a12 / 1000, 3) + ' + (' + N(lv.a1, 4) + ' + ' + N(hv.a2, 4) + ')/3 = ' + N(sc.ap, 4) + ' ' + u.m);
    f('d_{12} = D\'\'_{1} + a_{12} = ' + N(lv.D1o, 4) + ' + ' + N(ins2.a12 / 1000, 3) + ' = ' + N(sc.d12, 4) + ' ' + u.m + ';   β = π·d_{12}/l = π·' + N(sc.d12, 4) + '/' + N(lv.l1, 3) + ' = ' + N(sc.beta, 3));
    f('σ = (a_{12} + a_{1} + a_{2})/(π·l) = ' + N(sc.sig, 4) + ';   k_{р} = 1 − σ·(1 − e^{−1/σ}) = ' + N(sc.kp, 3));
    p('Коэффициент k_{q}, учитывающий неравномерное распределение витков по высоте из-за разрыва в регулировочной зоне (x = l_{x}/l, l_{x} = ' + N(sc.lx, 3) + ' м):',
      "Rostlash zonasidagi uzilish sababli o'ramlarning balandlik bo'yicha notekis taqsimlanishini hisobga oluvchi k_{q} koeffitsienti (x = l_{x}/l, l_{x} = " + N(sc.lx, 3) + ' m):');
    f('k_{q} = 1 + x^{2}·l/(3·a_{р}·k_{р}) = 1 + ' + N(sc.lx / lv.l1, 4) + '^{2}·' + N(lv.l1, 3) + '/(3·' + N(sc.ap, 4) + '·' + N(sc.kp, 3) + ') = ' + N(sc.kq, 3));
    f('u_{р} = 7,9·f·S\'·β·a_{р}·k_{р}·k_{q}/U_{в}^{2}·10^{-1} = 7,9·50·' + N(e.Sf, 1) + '·' + N(sc.beta, 3) + '·' + N(sc.ap, 4) + '·' + N(sc.kp, 3) + '·' + N(sc.kq, 3) + '/' + N(lv.Uv, 3) + '^{2}·10^{-1} = ' + N(sc.up, 3) + ' %');
    p('Напряжение короткого замыкания:', 'Qisqa tutashuv kuchlanishi:');
    f('u_{к} = √(u_{р}^{2} + u_{а}^{2}) = √(' + N(sc.up, 3) + '^{2} + ' + N(sc.ua, 3) + '^{2}) = ' + N(sc.uk, 3) + ' %');
    chk(Math.abs(sc.ukdev - 100) <= 10, 'u_{к} составляет ' + dev(sc.ukdev) + ' заданного значения (допуск ±10 %)', "u_{к} berilgan qiymatning " + dev(sc.ukdev) + ' ini tashkil etadi (ruxsatnoma ±10 %)');
    h2('Токи короткого замыкания и нагрев обмоток', "Qisqa tutashuv toklari va chulg'amlarning qizishi");
    p('Установившийся ток короткого замыкания на обмотке ВН (S_{к} = ' + sc.Sk + ' МВ·А — мощность КЗ сети по табл. 14):', "YuK chulg'amidagi barqaror qisqa tutashuv toki (S_{к} = " + sc.Sk + ' MV·A — tarmoqning QT quvvati, 14-jadval):');
    f('I_{к.у} = 100·I_{2}/(u_{к}·[1 + 100·S_{н}/(u_{к}·S_{к})]) = 100·' + N(e.I2, 2) + '/(' + N(sc.uk, 3) + '·[1 + 100·' + N(S) + '/(' + N(sc.uk, 3) + '·' + sc.Sk + '·10^{3})]) = ' + N(sc.Iky, 1) + ' ' + u.A);
    p('Мгновенное максимальное значение тока короткого замыкания (u_{р}/u_{а} = ' + N(sc.up / sc.ua, 2) + '):', 'Qisqa tutashuv tokining eng katta oniy qiymati (u_{р}/u_{а} = ' + N(sc.up / sc.ua, 2) + '):');
    f('k_{max}·√2 = √2·(1 + e^{−π·u_{а}/u_{р}}) = ' + N(sc.kmax, 3) + ';   i_{к.max} = ' + N(sc.kmax, 3) + '·' + N(sc.Iky, 1) + ' = ' + N(sc.ikmax, 0) + ' ' + u.A);
    p('Температура обмоток через t_{к} = 5 с после возникновения КЗ (начальная θ_{н} = 90 °С):', "QT boshlanganidan t_{к} = 5 s o'tgach chulg'amlar harorati (boshlang'ich θ_{н} = 90 °C):");
    var cK = Cu ? '12,5' : '5,5';
    f('θ_{к1} = 670·t_{к}/(' + cK + '·(u_{к}/J_{1})^{2} − t_{к}) + θ_{н} = 670·5/(' + cK + '·(' + N(sc.uk, 3) + '/' + N(lv.J1 / 1e6, 3) + ')^{2} − 5) + 90 = ' + N(sc.th1, 1) + ' ' + u.C);
    f('θ_{к2} = 670·t_{к}/(' + cK + '·(u_{к}/J_{2})^{2} − t_{к}) + θ_{н} = 670·5/(' + cK + '·(' + N(sc.uk, 3) + '/' + N(hv.J2 / 1e6, 3) + ')^{2} − 5) + 90 = ' + N(sc.th2, 1) + ' ' + u.C);
    chk(Math.max(sc.th1, sc.th2) <= sc.thlim, 'Допустимая температура обмотки при КЗ ' + sc.thlim + ' °С — условие ' + (Math.max(sc.th1, sc.th2) <= sc.thlim ? 'выполняется' : 'не выполняется'),
      "QT da chulg'amning ruxsat etilgan harorati " + sc.thlim + ' °C — shart ' + (Math.max(sc.th1, sc.th2) <= sc.thlim ? 'bajariladi' : 'bajarilmaydi'));

    // ---------- 7 Магнитная система ----------
    h1('Расчёт магнитной системы', 'Magnit tizimini hisoblash');
    p('Принята конструкция трёхфазной плоской шихтованной магнитной системы из пластин холоднокатаной стали марки 3405 толщиной 0,30 мм, диаметр стержня d = ' + N(m.d, 2) + ' м без прессующей пластины, число ступеней в сечении стержня ' + m.steps + '. Стержни скрепляются бандажами из стеклоленты, ярма прессуются ярмовыми балками. Площади ступенчатых фигур и объём угла — по табл. 16:',
      "Qalinligi 0,30 mm bo'lgan 3405 markali sovuq prokatlangan po'lat plastinalardan uch fazali tekis shixtalangan magnit tizimi konstruksiyasi qabul qilindi, sterjen diametri d = " + N(m.d, 2) + " m presslovchi plastinasiz, sterjen kesimidagi pog'onalar soni " + m.steps + ". Sterjenlar shisha lentali bandajlar bilan mahkamlanadi, yarmolar yarmo balkalari bilan presslanadi. Pog'onali shakllar yuzalari va burchak hajmi — 16-jadvaldan:");
    f('П_{ф.с} = ' + N(co.Pfc * 1e4, 1) + ' ' + L('см', 'sm') + '^{2} = ' + N(co.Pfc, 5) + ' ' + u.m2 + ';   П_{ф.я} = ' + N(co.Pfy * 1e4, 1) + ' ' + L('см', 'sm') + '^{2} = ' + N(co.Pfy, 5) + ' ' + u.m2 + ';   V_{у} = ' + N(co.Vy * 1e6, 0) + ' ' + L('см', 'sm') + '^{3} = ' + N(co.Vy, 6) + ' ' + u.m3);
    p('Активные сечения стержня и ярма, объём стали угла:', "Sterjen va yarmoning aktiv kesimlari, burchak po'latining hajmi:");
    f('П_{с} = k_{з}·П_{ф.с} = ' + N(P.kz, 3) + '·' + N(co.Pfc, 5) + ' = ' + N(co.Pc, 5) + ' ' + u.m2);
    f('П_{я} = k_{з}·П_{ф.я} = ' + N(P.kz, 3) + '·' + N(co.Pfy, 5) + ' = ' + N(co.Py, 5) + ' ' + u.m2);
    f('V_{у.ст} = k_{з}·V_{у} = ' + N(P.kz, 3) + '·' + N(co.Vy, 6) + ' = ' + N(co.Vyst, 6) + ' ' + u.m3);
    p('Длина стержня и расстояние между осями стержней:', "Sterjen uzunligi va sterjenlar o'qlari orasidagi masofa:");
    f('l_{с} = l + 2·l_{02} = ' + N(lv.l1, 3) + ' + 2·' + N(ins2.l02 / 1000, 3) + ' = ' + N(co.lc, 3) + ' ' + u.m);
    f('C = D\'\'_{2} + a_{22} = ' + N(hv.D2o, 4) + ' + ' + N(ins2.a22 / 1000, 3) + ' = ' + N(co.C, 4) + ' ' + u.m);
    p('Массы стали (γ_{ст} = 7650 кг/м^{3} — плотность холоднокатаной стали; a_{1я} = ' + N(co.hya, 3) + ' м — ширина пластины первого пакета ярма):',
      "Po'lat massalari (γ_{ст} = 7650 kg/m^{3} — sovuq prokatlangan po'lat zichligi; a_{1я} = " + N(co.hya, 3) + ' m — yarmo birinchi paketi plastinasining kengligi):');
    f('G_{у} = V_{у.ст}·γ_{ст} = ' + N(co.Vyst, 6) + '·7650 = ' + N(co.Gy, 1) + ' ' + u.kg);
    f('G_{я} = 2·П_{я}·2C·γ_{ст} + 2·G_{у} = 2·' + N(co.Py, 5) + '·2·' + N(co.C, 4) + '·7650 + 2·' + N(co.Gy, 1) + ' = ' + N(co.Gyp, 1) + ' + ' + N(co.Gypp, 1) + ' = ' + N(co.Gya, 1) + ' ' + u.kg);
    f('G\'_{с} = 3·l_{с}·П_{с}·γ_{ст} = 3·' + N(co.lc, 3) + '·' + N(co.Pc, 5) + '·7650 = ' + N(co.Gcp, 1) + ' ' + u.kg);
    f('G\'\'_{с} = 3·(П_{с}·a_{1я}·γ_{ст} − G_{у}) = 3·(' + N(co.Pc, 5) + '·' + N(co.hya, 3) + '·7650 − ' + N(co.Gy, 1) + ') = ' + N(co.Gcpp, 1) + ' ' + u.kg);
    f('G_{с} = G\'_{с} + G\'\'_{с} = ' + N(co.Gc, 1) + ' ' + u.kg + ';   G_{ст} = G_{я} + G_{с} = ' + N(co.Gya, 1) + ' + ' + N(co.Gc, 1) + ' = ' + N(co.Gst, 1) + ' ' + u.kg);

    // ---------- 8 Потери ХХ ----------
    h1('Расчёт потерь холостого хода', 'Salt ishlash isroflarini hisoblash');
    f('B_{с} = U_{в}/(4,44·f·П_{с}) = ' + N(lv.Uv, 3) + '/(4,44·50·' + N(co.Pc, 5) + ') = ' + N(nl.Bc, 3) + ' ' + u.T);
    f('B_{я} = U_{в}/(4,44·f·П_{я}) = ' + N(lv.Uv, 3) + '/(4,44·50·' + N(co.Py, 5) + ') = ' + N(nl.By, 3) + ' ' + u.T);
    f('B_{кос} = B_{с}/√2 = ' + N(nl.Bkos, 3) + ' ' + u.T + ';   П_{кос} = √2·П_{с} = ' + N(nl.Pkos, 5) + ' ' + u.m2);
    p('Удельные потери для стали стержней, ярм и стыков находим по табл. 17 для стали 3405 толщиной 0,30 мм при шихтовке в две пластины:',
      "Sterjenlar, yarmolar va tutashuvlar po'lati uchun solishtirma isroflarni 17-jadvaldan qalinligi 0,30 mm bo'lgan 3405 po'lat uchun ikki plastinali shixtalashda topamiz:");
    f('B_{с} = ' + N(nl.Bc, 3) + ' ' + u.T + ': p_{с} = ' + N(nl.pc, 3) + ' ' + u.Wkg + ', p_{с.з} = ' + N(nl.pcz, 0) + ' ' + u.Wm2);
    f('B_{я} = ' + N(nl.By, 3) + ' ' + u.T + ': p_{я} = ' + N(nl.py, 3) + ' ' + u.Wkg + ', p_{я.з} = ' + N(nl.pyz, 0) + ' ' + u.Wm2);
    f('B_{кос} = ' + N(nl.Bkos, 3) + ' ' + u.T + ': p_{кос} = ' + N(nl.pkos, 0) + ' ' + u.Wm2);
    p('Для плоской магнитной системы с косыми стыками на крайних и прямыми на среднем стержне, с многоступенчатым ярмом, без отверстий для шпилек, с отжигом пластин после резки и удалением заусенцев принимаем коэффициенты (табл. 18, 19): k_{п.р} = ' + N(nl.kpr, 2) + '; k_{п.з} = ' + N(nl.kpz, 2) + '; k_{п.я} = ' + N(nl.kpya, 2) + '; k_{п.п} = ' + N(nl.kpp, 3) + '; k_{п.ш} = ' + N(nl.kpsh, 2) + '; k_{п.у} = ' + N(nl.kpy, 2) + '. Потери холостого хода:',
      "Chetki sterjenlarda qiya va o'rtasida to'g'ri tutashuvli, ko'p pog'onali yarmoli, shpilka teshiklarisiz, kesishdan keyin plastinalari kuydirilgan va g'adir-budurlari olib tashlangan tekis magnit tizimi uchun koeffitsientlarni qabul qilamiz (18, 19-jadvallar): k_{п.р} = " + N(nl.kpr, 2) + '; k_{п.з} = ' + N(nl.kpz, 2) + '; k_{п.я} = ' + N(nl.kpya, 2) + '; k_{п.п} = ' + N(nl.kpp, 3) + '; k_{п.ш} = ' + N(nl.kpsh, 2) + '; k_{п.у} = ' + N(nl.kpy, 2) + '. Salt ishlash isroflari:');
    f('P_{х} = [k_{п.р}·k_{п.з}·(p_{с}·G_{с} + p_{я}·G\'_{я} − 4·p_{я}·G_{у} + (p_{с} + p_{я})/2·k_{п.у}·G_{у}) + 4·p_{кос}·П_{кос} + 1·p_{с.з}·П_{с} + 2·p_{я.з}·П_{я}]·k_{п.я}·k_{п.п}·k_{п.ш}');
    f('P_{х} = [' + N(nl.kpr, 2) + '·' + N(nl.kpz, 2) + '·(' + N(nl.pc, 3) + '·' + N(co.Gc, 1) + ' + ' + N(nl.py, 3) + '·' + N(co.Gyp, 1) + ' − 4·' + N(nl.py, 3) + '·' + N(co.Gy, 1) + ' + ' + N((nl.pc + nl.py) / 2, 3) + '·' + N(nl.kpy, 2) + '·' + N(co.Gy, 1) + ') + 4·' + N(nl.pkos, 0) + '·' + N(nl.Pkos, 5) + ' + ' + N(nl.pcz, 0) + '·' + N(co.Pc, 5) + ' + 2·' + N(nl.pyz, 0) + '·' + N(co.Py, 5) + ']·' + N(nl.kpya, 2) + '·' + N(nl.kpp, 3) + '·' + N(nl.kpsh, 2) + ' = ' + N(nl.Px, 0) + ' ' + u.W);
    chk(nl.Pxdev <= 115, 'P_{х} составляет ' + dev(nl.Pxdev) + ' заданного значения (не должно превышать заданное более чем на 15 %)', "P_{х} berilgan qiymatning " + dev(nl.Pxdev) + " ini tashkil etadi (berilgandan 15 % dan ortiq oshmasligi kerak)");

    // ---------- 9 Ток ХХ ----------
    h1('Расчёт тока холостого хода', 'Salt ishlash tokini hisoblash');
    p('По табл. 20 находим удельные намагничивающие мощности:', "20-jadvaldan solishtirma magnitlovchi quvvatlarni topamiz:");
    f('B_{с} = ' + N(nl.Bc, 3) + ' ' + u.T + ': q_{с} = ' + N(n2.qc, 3) + ' ' + u.VAkg + ', q_{с.з} = ' + N(n2.qcz, 0) + ' ' + u.VAm2);
    f('B_{я} = ' + N(nl.By, 3) + ' ' + u.T + ': q_{я} = ' + N(n2.qy, 3) + ' ' + u.VAkg + ', q_{я.з} = ' + N(n2.qyz, 0) + ' ' + u.VAm2);
    f('B_{кос} = ' + N(nl.Bkos, 3) + ' ' + u.T + ': q_{кос} = ' + N(n2.qkos, 0) + ' ' + u.VAm2);
    p('С учётом принятой конструкции и технологии изготовления принимаем коэффициенты: k_{т.р} = ' + N(n2.ktr, 2) + '; k_{т.з} = ' + N(n2.ktz, 2) + '; k_{т.пл} = ' + N(n2.ktpl, 3) + ' (табл. 21, ширина пластины второго пакета a_{2} ≈ ' + N(co.a2pk, 3) + ' м); k_{т.я} = ' + N(n2.ktya, 2) + '; k_{т.п} = ' + N(n2.ktp, 3) + '; k_{т.ш} = ' + N(n2.ktsh, 2) + '; k_{т.у} = ' + N(n2.kty, 2) + ' (табл. 22). Намагничивающая мощность холостого хода:',
      "Qabul qilingan konstruksiya va tayyorlash texnologiyasini hisobga olib koeffitsientlarni qabul qilamiz: k_{т.р} = " + N(n2.ktr, 2) + '; k_{т.з} = ' + N(n2.ktz, 2) + '; k_{т.пл} = ' + N(n2.ktpl, 3) + " (21-jadval, ikkinchi paket plastinasi kengligi a_{2} ≈ " + N(co.a2pk, 3) + ' m); k_{т.я} = ' + N(n2.ktya, 2) + '; k_{т.п} = ' + N(n2.ktp, 3) + '; k_{т.ш} = ' + N(n2.ktsh, 2) + '; k_{т.у} = ' + N(n2.kty, 2) + " (22-jadval). Salt ishlashdagi magnitlovchi quvvat:");
    f('Q_{х} = [k_{т.р}·k_{т.з}·(q_{с}·G_{с} + q_{я}·G\'_{я} − 4·q_{я}·G_{у} + (q_{с} + q_{я})/2·k_{т.у}·k_{т.пл}·G_{у}) + 4·q_{кос}·П_{кос} + 1·q_{с.з}·П_{с} + 2·q_{я.з}·П_{я}]·k_{т.я}·k_{т.п}·k_{т.ш}');
    f('Q_{х} = [' + N(n2.ktr, 2) + '·' + N(n2.ktz, 2) + '·(' + N(n2.qc, 3) + '·' + N(co.Gc, 1) + ' + ' + N(n2.qy, 3) + '·' + N(co.Gyp, 1) + ' − 4·' + N(n2.qy, 3) + '·' + N(co.Gy, 1) + ' + ' + N((n2.qc + n2.qy) / 2, 3) + '·' + N(n2.kty, 2) + '·' + N(n2.ktpl, 3) + '·' + N(co.Gy, 1) + ') + 4·' + N(n2.qkos, 0) + '·' + N(nl.Pkos, 5) + ' + ' + N(n2.qcz, 0) + '·' + N(co.Pc, 5) + ' + 2·' + N(n2.qyz, 0) + '·' + N(co.Py, 5) + ']·' + N(n2.ktya, 2) + '·' + N(n2.ktp, 3) + '·' + N(n2.ktsh, 2) + ' = ' + N(n2.Qx, 0) + ' ' + u.VA);
    p('Ток холостого хода и его составляющие:', 'Salt ishlash toki va uning tashkil etuvchilari:');
    f('i_{о} = Q_{х}/(10·S_{н}) = ' + N(n2.Qx, 0) + '/(10·' + N(S) + ') = ' + N(n2.i0, 3) + ' %');
    chk(n2.i0dev <= 130, 'i_{о} составляет ' + dev(n2.i0dev) + ' заданного значения (допуск +30 %)', "i_{о} berilgan qiymatning " + dev(n2.i0dev) + ' ini tashkil etadi (ruxsatnoma +30 %)');
    f('i_{о.а} = P_{х}/(10·S_{н}) = ' + N(nl.Px, 0) + '/(10·' + N(S) + ') = ' + N(n2.i0a, 3) + ' %;   i_{о.р} = √(i_{о}^{2} − i_{о.а}^{2}) = ' + N(n2.i0p, 3) + ' %');

    // ---------- 10 Тепловой расчёт обмоток ----------
    h1('Тепловой расчёт обмоток', "Chulg'amlarning issiqlik hisobi");
    p('Внутренний перепад температуры (δ = 0,25·10^{-3} м — толщина изоляции провода на одну сторону; λ_{из} = 0,17 Вт/(м·°С) — теплопроводность бумажной, пропитанной маслом изоляции, табл. 23):',
      "Ichki harorat farqi (δ = 0,25·10^{-3} m — simning bir tomondagi izolyatsiya qalinligi; λ_{из} = 0,17 Vt/(m·°C) — moy shimdirilgan qog'oz izolyatsiyaning issiqlik o'tkazuvchanligi, 23-jadval):");
    f(L('НН', 'PK') + ': θ_{о1} = q_{1}·δ/λ_{из} = ' + N(lv.q1, 0) + '·0,25·10^{-3}/0,17 = ' + N(th.th01, 2) + ' ' + u.C);
    if (hv.type === 'disc') f(L('ВН', 'YuK') + ': θ_{о2} = q_{2}·δ/λ_{из} = ' + N(hv.q2, 0) + '·0,25·10^{-3}/0,17 = ' + N(th.th02, 2) + ' ' + u.C);
    else {
      p('Для многослойной цилиндрической обмотки ВН: средняя теплопроводность λ_{ср} и потери в единице объёма p обмотки:', "Ko'p qatlamli silindrik YuK chulg'ami uchun: o'rtacha issiqlik o'tkazuvchanlik λ_{ср} va chulg'am hajm birligidagi isroflar p:");
      f('λ_{ср} = λ_{из}·(d\' + δ_{мсл})/((d\' − d) + δ_{мсл}) = ' + N(th.lamsr, 3) + ' ' + u.Wmc + ';   p = ' + N(th.pvol, 0) + ' ' + u.Wm3);
      f(L('ВН', 'YuK') + ': θ_{о2} = p·a^{2}/(8·λ_{ср}) = ' + N(th.th02, 2) + ' ' + u.C);
    }
    p('Перепад температуры на поверхности обмоток (k_{1} = 1 — естественное масляное охлаждение; k_{2} = 1,1 для внутренней обмотки НН и 1,0 для наружной обмотки ВН; k_{3} — по табл. 24):',
      "Chulg'amlar sirtidagi harorat farqi (k_{1} = 1 — tabiiy moyli sovutish; k_{2} = 1,1 ichki PK chulg'ami uchun va 1,0 tashqi YuK chulg'ami uchun; k_{3} — 24-jadvaldan):");
    f(L('НН', 'PK') + ': θ_{о.м1} = k_{1}·k_{2}·k_{3}·0,35·q_{1}^{0,6} = 1·1,1·' + N(th.k31, 2) + '·0,35·' + N(lv.q1, 0) + '^{0,6} = ' + N(th.thom1, 2) + ' ' + u.C + '   (h_{к}/a_{1} = ' + N(th.r1, 3) + ')');
    if (hv.type === 'disc') f(L('ВН', 'YuK') + ': θ_{о.м2} = k_{1}·k_{2}·k_{3}·0,35·q_{2}^{0,6} = 1·1,0·' + N(th.k32, 2) + '·0,35·' + N(hv.q2, 0) + '^{0,6} = ' + N(th.thom2, 2) + ' ' + u.C + '   (h_{к}/a_{2} = ' + N(th.r2, 3) + ')');
    else f(L('ВН', 'YuK') + ': θ_{о.м2} = 0,285·q_{2}^{0,6} = 0,285·' + N(hv.q2, 0) + '^{0,6} = ' + N(th.thom2, 2) + ' ' + u.C);
    p('Полный средний перепад температуры от обмотки к маслу:', "Chulg'amdan moyga to'liq o'rtacha harorat farqi:");
    f(L('НН', 'PK') + ': θ_{о.м.ср1} = θ_{о1} + θ_{о.м1} = ' + N(th.th01, 2) + ' + ' + N(th.thom1, 2) + ' = ' + N(th.thsr1, 2) + ' ' + u.C);
    f(L('ВН', 'YuK') + ': θ_{о.м.ср2} = θ_{о2} + θ_{о.м2} = ' + N(th.th02, 2) + ' + ' + N(th.thom2, 2) + ' = ' + N(th.thsr2, 2) + ' ' + u.C);

    // ---------- 11 Бак ----------
    h1('Тепловой расчёт бака', 'Bakning issiqlik hisobi');
    p('По табл. 25 в соответствии с мощностью трансформатора выбираем конструкцию гладкого бака с навесными радиаторами ' + (tk.radType === 'T30' ? 'с гнутыми трубами (двойные радиаторы, табл. 30)' : 'с прямыми трубами в два ряда (табл. 28)') + '. Изоляционные расстояния отводов определяем до прессующей балки верхнего ярма и до стенки бака; внешние габариты прессующих балок принимаем равными внешнему габариту обмотки ВН.',
      "25-jadval bo'yicha transformator quvvatiga mos ravishda " + (tk.radType === 'T30' ? "egilgan quvurli osma radiatorli (qo'sh radiatorlar, 30-jadval)" : "ikki qator to'g'ri quvurli osma radiatorli (28-jadval)") + " silliq bak konstruksiyasini tanlaymiz. Otvodlarning izolyatsiya masofalarini yuqori yarmoning presslovchi balkasigacha va bak devorigacha aniqlaymiz; presslovchi balkalarning tashqi o'lchamlarini YuK chulg'amining tashqi o'lchamiga teng deb olamiz.");
    p('Изоляционные расстояния (табл. 26): s_{1} = ' + tk.s1 + ' мм — от отвода ВН до стенки бака; s_{2} = ' + tk.s2 + ' мм — от отвода ВН до собственной обмотки; s_{3} = ' + tk.s3 + ' мм — от отвода НН до стенки бака; s_{4} = ' + tk.s4 + ' мм — от отвода НН до обмотки ВН; d_{1} = ' + tk.d1 + ' мм — размер отвода НН (шины); d_{2} = ' + tk.d2 + ' мм — диаметр изолированного отвода ВН.',
      "Izolyatsiya masofalari (26-jadval): s_{1} = " + tk.s1 + " mm — YuK otvodidan bak devorigacha; s_{2} = " + tk.s2 + " mm — YuK otvodidan o'z chulg'amigacha; s_{3} = " + tk.s3 + " mm — PK otvodidan bak devorigacha; s_{4} = " + tk.s4 + " mm — PK otvodidan YuK chulg'amigacha; d_{1} = " + tk.d1 + " mm — PK otvodi (shina) o'lchami; d_{2} = " + tk.d2 + " mm — YuK izolyatsiyalangan otvodining diametri.");
    f(L('Ширина бака', 'Bak kengligi') + ': B = D\'\'_{2} + (s_{1} + s_{2} + d_{2} + s_{3} + s_{4} + d_{1})·10^{-3} = ' + N(hv.D2o, 4) + ' + (' + [tk.s1, tk.s2, tk.d2, tk.s3, tk.s4, tk.d1].join(' + ') + ')·10^{-3} = ' + N(tk.B0, 3) + ' ' + u.m);
    p('Принимаем B = ' + N(tk.B, 2) + ' м при центральном положении активной части в баке.', "Aktiv qism bakda markaziy joylashganda B = " + N(tk.B, 2) + ' m qabul qilamiz.');
    f(L('Длина бака', 'Bak uzunligi') + ': A = 2·C + B = 2·' + N(co.C, 4) + ' + ' + N(tk.B, 2) + ' = ' + N(tk.A, 3) + ' ' + u.m);
    f(L('Высота активной части', 'Aktiv qism balandligi') + ': H_{а.ч} = l_{с} + 2·h_{я} + n = ' + N(co.lc, 3) + ' + 2·' + N(tk.hya, 3) + ' + 0,05 = ' + N(tk.Hach, 3) + ' ' + u.m);
    p('где h_{я} = ' + N(tk.hya, 3) + ' м — высота ярма; n = 0,05 м — толщина бруска между дном бака и нижним ярмом. Минимальное расстояние от ярма до крышки бака по табл. 27: H_{я.к} = ' + N(tk.Hyk, 2) + ' м.',
      "bu yerda h_{я} = " + N(tk.hya, 3) + " m — yarmo balandligi; n = 0,05 m — bak tubi va pastki yarmo orasidagi brusok qalinligi. 27-jadval bo'yicha yarmodan bak qopqog'igacha eng kichik masofa: H_{я.к} = " + N(tk.Hyk, 2) + ' m.');
    f('H_{б} = H_{а.ч} + H_{я.к} = ' + N(tk.Hach, 3) + ' + ' + N(tk.Hyk, 2) + ' = ' + N(tk.Hb0, 3) + ' ' + u.m);
    p('Для развития поверхности охлаждения применяем радиаторы с расстоянием между осями фланцев A_{р} = ' + tk.rad[0] + ' мм и поверхностью труб П_{к.тр} = ' + N(tk.rad[1], 3) + ' м^{2}' + (tk.Pkk ? ', поверхность двух коллекторов П_{к.к} = ' + N(tk.Pkk, 2) + ' м^{2}' : '') + '. Для их установки глубина бака (c_{1} = 0,085 м, c_{2} = 0,1 м — расстояния осей фланцев от нижнего и верхнего срезов стенки):',
      "Sovutish sirtini oshirish uchun flanslar o'qlari orasidagi masofa A_{р} = " + tk.rad[0] + ' mm va quvurlar sirti П_{к.тр} = ' + N(tk.rad[1], 3) + ' m^{2}' + (tk.Pkk ? ", ikki kollektor sirti П_{к.к} = " + N(tk.Pkk, 2) + ' m^{2}' : '') + " bo'lgan radiatorlarni qo'llaymiz. Ularni o'rnatish uchun bak chuqurligi (c_{1} = 0,085 m, c_{2} = 0,1 m — flans o'qlarining devor pastki va yuqori kesimlaridan masofalari):");
    f('H_{б} ≥ A_{р} + c_{1} + c_{2} = ' + N(tk.rad[0] / 1000, 3) + ' + 0,085 + 0,1 = ' + N(tk.rad[0] / 1000 + 0.185, 3) + ' ' + u.m + ';   ' + L('принимаем', 'qabul qilamiz') + ' H_{б} = ' + N(tk.Hb, 2) + ' ' + u.m);
    p('Допустимое превышение средней температуры масла над воздухом для наиболее нагретой обмотки:', "Eng qizigan chulg'am uchun moy o'rtacha haroratining havodan ruxsat etilgan oshishi:");
    f('θ_{м.в} = 65 − θ_{о.м.ср} = 65 − ' + N(tk.thmax, 2) + ' = ' + N(65 - tk.thmax, 2) + ' ' + u.C + (tk.thmvLim ? L(' → ограничиваем 50 °С (1,2·θ_{м.в} ≤ 60 °С)', " → 50 °C bilan cheklaymiz (1,2·θ_{м.в} ≤ 60 °C)") : ';   1,2·θ_{м.в} = ' + N(1.2 * tk.thmv, 1) + ' < 60 ' + u.C));
    p('Принимая перепад температуры на внутренней поверхности стенки бака θ_{м.б} = 5 °С и запас 2 °С:', "Bak devori ichki sirtidagi harorat farqini θ_{м.б} = 5 °C va 2 °C zaxira deb qabul qilib:");
    f('θ_{б.в} = θ_{м.в} − θ_{м.б} − 2 = ' + N(tk.thmv, 2) + ' − 5 − 2 = ' + N(tk.thbv, 2) + ' ' + u.C);
    p('Поверхность конвекции гладкой стенки бака и ориентировочная поверхность излучения (k = 1,5 для бака с навесными радиаторами):', "Bak silliq devorining konveksiya sirti va taxminiy nurlanish sirti (osma radiatorli bak uchun k = 1,5):");
    f('П_{к.гл} = H_{б}·[2·(A − B) + π·B] = ' + N(tk.Hb, 2) + '·[2·(' + N(tk.A, 3) + ' − ' + N(tk.B, 2) + ') + 3,14·' + N(tk.B, 2) + '] = ' + N(tk.Pkgl, 2) + ' ' + u.m2);
    f('П_{и} = k·П_{к.гл} = 1,5·' + N(tk.Pkgl, 2) + ' = ' + N(tk.Pi, 2) + ' ' + u.m2);
    p('Ориентировочная необходимая поверхность конвекции:', 'Taxminiy zarur konveksiya sirti:');
    f('П\'_{к} = 1,05·(P_{к} + P_{х})/(2,5·θ_{б.в}^{1,25}) − 1,12·П_{и} = 1,05·(' + N(sc.Pkn, 0) + ' + ' + N(nl.Px, 0) + ')/(2,5·' + N(tk.thbv, 2) + '^{1,25}) − 1,12·' + N(tk.Pi, 2) + ' = ' + N(tk.Pkreq, 2) + ' ' + u.m2);
    p('Поверхность крышки бака (0,16 — удвоенная ширина верхней рамы бака, 0,5 — учёт закрытия вводами и арматурой):', "Bak qopqog'ining sirti (0,16 — bak yuqori ramasining ikkilangan kengligi, 0,5 — kiritmalar va armatura bilan yopilishini hisobga oladi):");
    f('П_{к.кр} = 0,5·[(A − B)·(B + 0,16) + π·(B + 0,16)^{2}/4] = ' + N(tk.Pkkr, 3) + ' ' + u.m2);
    f('ΣП_{к.р} = П\'_{к} − П_{к.гл} − П_{к.кр} = ' + N(tk.Pkreq, 2) + ' − ' + N(tk.Pkgl, 2) + ' − ' + N(tk.Pkkr, 3) + ' = ' + N(tk.SPkr, 2) + ' ' + u.m2);
    p('Поверхность конвекции одного радиатора, приведённая к поверхности гладкой стенки (k_{ф} = ' + N(tk.kf, 2) + ', табл. 29):', "Bitta radiatorning silliq devor sirtiga keltirilgan konveksiya sirti (k_{ф} = " + N(tk.kf, 2) + ', 29-jadval):');
    f('П_{к.р} = k_{ф}·П_{к.тр} + П_{к.к} = ' + N(tk.kf, 2) + '·' + N(tk.rad[1], 3) + ' + ' + N(tk.Pkk, 2) + ' = ' + N(tk.Pkr1, 2) + ' ' + u.m2);
    f('n_{р} = ΣП_{к.р}/П_{к.р} = ' + N(tk.SPkr, 2) + '/' + N(tk.Pkr1, 2) + ' = ' + N(tk.SPkr / tk.Pkr1, 2) + ';   ' + L('принимаем', 'qabul qilamiz') + ' n_{р} = ' + tk.nr);
    B.push({ t: 'img', key: 'tank' });
    f('П_{к} = n_{р}·П_{к.р} + П_{к.гл} + П_{к.кр} = ' + tk.nr + '·' + N(tk.Pkr1, 2) + ' + ' + N(tk.Pkgl, 2) + ' + ' + N(tk.Pkkr, 3) + ' = ' + N(tk.Pk, 1) + ' ' + u.m2);

    // ---------- 12 Превышения ----------
    h1('Превышения температуры масла и обмоток над воздухом', "Moy va chulg'amlar haroratining havodan oshishi");
    p('Среднее превышение температуры наружной поверхности бака (труб) над температурой воздуха:', 'Bak (quvurlar) tashqi sirti haroratining havo haroratidan o\'rtacha oshishi:');
    f('θ_{б.в} = [1,05·(P_{к} + P_{х})/(2,8·П_{и} + 2,5·П_{к})]^{0,8} = [' + N(tk.Ptot, 0) + '/(2,8·' + N(tk.Pi, 2) + ' + 2,5·' + N(tk.Pk, 1) + ')]^{0,8} = ' + N(tk.thbv2, 2) + ' ' + u.C);
    p('Среднее превышение температуры масла вблизи стенки над температурой внутренней поверхности стенки:', "Devor yaqinidagi moy haroratining devor ichki sirti haroratidan o'rtacha oshishi:");
    f('θ_{м.б} = 0,165·[1,05·(P_{к} + P_{х})/(n_{р}·П_{к.тр} + П_{к.гл} + П_{к.кр})]^{0,6} = 0,165·[' + N(tk.Ptot, 0) + '/(' + tk.nr + '·' + N(tk.rad[1], 3) + ' + ' + N(tk.Pkgl, 2) + ' + ' + N(tk.Pkkr, 3) + ')]^{0,6} = ' + N(tk.thmb, 2) + ' ' + u.C);
    p('Превышение средней температуры масла над воздухом и превышение в верхних слоях:', "Moy o'rtacha haroratining havodan oshishi va yuqori qatlamlardagi oshish:");
    f('θ_{м.в} = θ_{м.б} + θ_{б.в} = ' + N(tk.thmb, 2) + ' + ' + N(tk.thbv2, 2) + ' = ' + N(tk.thmv2, 2) + ' ' + u.C);
    f('θ_{м.в.в} = 1,2·θ_{м.в} = 1,2·' + N(tk.thmv2, 2) + ' = ' + N(tk.thmvv, 2) + ' ' + u.C);
    chk(tk.thmvv < 60, 'θ_{м.в.в} = ' + N(tk.thmvv, 1) + ' °С ' + (tk.thmvv < 60 ? '<' : '≥') + ' 60 °С', 'θ_{м.в.в} = ' + N(tk.thmvv, 1) + ' °C ' + (tk.thmvv < 60 ? '<' : '≥') + ' 60 °C');
    p('Превышение средней температуры обмоток над воздухом:', "Chulg'amlar o'rtacha haroratining havodan oshishi:");
    f(L('НН', 'PK') + ': θ_{о.в1} = θ_{о.м.ср1} + θ_{м.в} = ' + N(th.thsr1, 2) + ' + ' + N(tk.thmv2, 2) + ' = ' + N(tk.thov1, 2) + ' ' + u.C);
    f(L('ВН', 'YuK') + ': θ_{о.в2} = θ_{о.м.ср2} + θ_{м.в} = ' + N(th.thsr2, 2) + ' + ' + N(tk.thmv2, 2) + ' = ' + N(tk.thov2, 2) + ' ' + u.C);

      try { await dl.save({ filename: f.name, data: f.blob }); msg.textContent = t.saved + ' ' + f.name; }
      catch(e){ msg.textContent = e && e.code === 'declined' ? t.declined : t.noDl; }
    } else if (window.claude && window.claude.use){ msg.textContent = t.noDl; }
    else {
      var url = URL.createObjectURL(f.blob), a = document.createElement('a');
      a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      msg.textContent = t.saved + ' ' + f.name;
    }
  } catch(e){ msg.setAttribute('data-k','bad'); msg.textContent = t.errDocx + (e && e.message ? e.message : e); }
  btn.disabled = false;
}

// ---------- init ----------
$('lang-uz').addEventListener('click', function(){ lang = 'uz'; store('lang', lang); fillStatic(); render(); });
$('lang-ru').addEventListener('click', function(){ lang = 'ru'; store('lang', lang); fillStatic(); render(); });
$('variant').addEventListener('change', function(){ if (this.value !== 'custom') applyVariant(this.value); run(); });
$('teacher').addEventListener('input', function(){ touchedTeacher = true; });
$('run').addEventListener('click', run);
['S','U2','U1','scheme','mat','uk','Pk','P0','i0','ovd','ovw','ovB'].forEach(function(id){ $(id).addEventListener('change', function(){ if (['S','U2','U1','scheme','mat','uk','Pk','P0','i0'].indexOf(id) >= 0 && $('variant').value !== 'custom'){ var x = VARIANTS.filter(function(v){ return v.id === $('variant').value; })[0]; var cur = readInputs(); if (x && (cur.S !== x.S || cur.U2 !== x.U2 || cur.U1 !== x.U1 || cur.scheme !== x.scheme || cur.mat !== x.mat || cur.uk !== x.uk || cur.Pk !== x.Pk || cur.P0 !== x.P0 || cur.i0 !== x.i0)) $('variant').value = 'custom'; } run(); }); });
$('student').addEventListener('change', function(){ render(); });
$('dl-uz').addEventListener('click', function(){ download('uz', this); });
$('dl-ru').addEventListener('click', function(){ download('ru', this); });
lang = load('lang') || 'uz';
fillStatic();
var saved = load('inputs');
var hashV = (location.hash || '').replace('#','');
if (hashV && VARIANTS.some(function(v){ return v.id === hashV; })){ $('variant').value = hashV; applyVariant(hashV); }
else if (saved && saved.inp){
  $('variant').value = saved.variant || 'custom';
  var s = saved.inp; ['S','uk','Pk','P0','i0'].forEach(function(k){ $(k).value = s[k]; });
  $('U2').value = String(s.U2); $('U1').value = String(s.U1); $('scheme').value = s.scheme; $('mat').value = s.mat;
  if (s.ov){ if (s.ov.d) $('ovd').value = s.ov.d.toFixed(2); if (s.ov.w1) $('ovw').value = s.ov.w1; if (s.ov.Bc) $('ovB').value = s.ov.Bc; }
  if (saved.student) $('student').value = saved.student; if (saved.group) $('group').value = saved.group;
} else { $('variant').value = 'v1'; applyVariant('v1'); }
fillStatic();
run();
})();
</script>
